name: Upload release files (one-time)
on:
  push:
    paths: ['.github/workflows/upload-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, upload
        shell: bash
        run: |
          set -euo pipefail
          fetch () {
            name="$1"; base="$2"; count="$3"; sha="$4"
            rm -f "$name"
            for ((i=0;i<count;i++)); do
              p=$(printf "%03d" $i)
              curl -fsS --retry 8 --retry-all-errors --retry-delay 3 -A "okhttp/4.12.0" "$base/$p.bin" >> "$name"
            done
            echo "$sha  $name" | sha256sum -c -
            gh release upload v2.4 "$name" --clobber -R "$GITHUB_REPOSITORY"
            rm -f "$name"
          }
          fetch YumiCord-v2.4-arm64.apk https://yumicord-v24.sites.tab.bot/p 239 dd52a66edc0d965c6d17233ecbc0cb478d05f673fbb432009788a5a0dc4d499f
          cp .release-tmp/YumiCord-v2.4-source.zip ./YumiCord-v2.4-source.zip
          echo "3321249253cbb541eca5b16de15bb2bae2bf235fd1014c319f4e6a7fff0bc659  YumiCord-v2.4-source.zip" | sha256sum -c -
          gh release upload v2.4 YumiCord-v2.4-source.zip --clobber -R "$GITHUB_REPOSITORY"
          gh release view v2.4 -R "$GITHUB_REPOSITORY"
